<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUNLOP タイヤ電子荷票</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head><body>
<header><div><b>DUNLOP</b><span> タイヤ在庫管理</span></div><nav><button data-page="list">電子荷票一覧</button><button data-page="new">QRコード新規作成</button><button id="openStaffManager">担当者管理</button></nav></header>
<main>
<section id="page-list" class="page">
<div class="title"><div><h1>電子荷票一覧</h1><p>販売可能在庫を営業所外から確認できます。</p></div><button class="primary" data-page="new">＋ 新規作成</button></div>
<div class="filters"><input id="search" placeholder="銘柄・サイズ・管理番号で検索"><select id="season"><option value="">季節区分：すべて</option><option>夏</option><option>冬</option><option>オールシーズン</option></select><select id="stockFilter"><option value="">在庫：すべて</option><option value="free">フリー在庫あり</option><option value="zero">フリー在庫なし</option></select></div>
<div id="cards" class="cards"></div><div id="empty" class="empty">該当する電子荷票はありません。</div>
</section>
<section id="page-new" class="page hidden">
<div class="title"><div><h1>QRコード新規作成</h1><p>1枚のQRコードを「銘柄・サイズ」単位で発行します。</p></div></div>
<form id="newForm" class="panel formgrid">
<label>銘柄（パターン名）<input id="brand" required placeholder="例：WINTER MAXX 03"></label>
<label>季節区分<select id="newSeason" required><option value="">選択してください</option><option>夏</option><option>冬</option><option>オールシーズン</option></select></label>
<label>タイヤ幅<input id="width" required inputmode="numeric" placeholder="195"></label>
<label>偏平率<input id="ratio" required inputmode="numeric" placeholder="65"></label>
<label>リム径<input id="rim" required inputmode="numeric" placeholder="15"></label>
<label>ロードインデックス<input id="load" placeholder="91"></label>
<label>速度記号<input id="speed" placeholder="Q"></label>
<label>初期フリー在庫<input id="free" type="number" min="0" value="0" required></label>
<label>登録担当者<div class="select-action"><select id="newStaff" class="staff-select" required></select><button type="button" class="secondary add-staff-button">＋追加</button></div></label>
<div class="full note">メーカーと保管場所は管理しません。QRコードと荷票は在庫タイヤと一緒に移動してください。</div>
<div class="full actions"><button type="button" class="secondary" data-page="list">キャンセル</button><button class="primary" type="submit">QRコードを作成</button></div>
</form>
</section>
<section id="page-detail" class="page hidden"><div id="detail"></div></section>
</main>
<div id="stockModal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle">在庫入力</h2><label>本数<input id="modalCount" type="number" min="1" value="1" inputmode="numeric"></label><label>担当者<div class="select-action"><select id="modalStaff" class="staff-select"></select><button type="button" class="secondary add-staff-button">＋追加</button></div></label><label>摘要<input id="modalNote" placeholder="必要に応じて入力"></label><div class="actions"><button type="button" class="secondary" id="modalCancel">キャンセル</button><button type="button" class="primary" id="modalSubmit">登録</button></div></div></div>
<div id="staffManager" class="modal hidden"><div class="modal-card"><h2>担当者管理</h2><p>在庫入力のプルダウンに表示する担当者を追加します。</p><label>担当者名<input id="newStaffName" maxlength="40" placeholder="例：山田 太郎"></label><div class="actions"><button type="button" class="secondary" id="staffManagerClose">閉じる</button><button type="button" class="primary" id="staffAddSubmit">担当者を追加</button></div><h3>登録済み担当者</h3><ul id="staffList" class="staff-list"></ul></div></div>
<div id="toast"></div><script src="app.js"></script></body></html>
