<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUNLOP タイヤ電子荷票</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="supabase.bundle.js"></script><script src="qrcode.min.js"></script></head><body><header><b>DUNLOP タイヤ在庫管理</b><div><span id="user"></span><button id="logout" hidden>ログアウト</button></div></header><main><section id="login"><h1>ログイン</h1><form id="loginForm" class="panel"><label>メールアドレス<input id="email" type="email" required></label><label>パスワード<input id="password" type="password" required></label><button class="primary">ログイン</button><p id="loginMsg"></p></form></section><section id="app" hidden><nav><button data-go="list">一覧</button><button data-go="new">QR新規作成</button><button data-go="staff">担当者管理</button></nav><section id="list" class="view"><div class="bar"><h1>電子荷票一覧</h1><input id="search" placeholder="銘柄・サイズ・管理番号"></div><div id="rows"></div></section><section id="new" class="view" hidden><h1>QRコード新規作成</h1><form id="tagForm" class="panel grid"><label>銘柄<input name="brand" required></label><label>季節<select name="season" required><option>夏</option><option>冬</option><option>オールシーズン</option></select></label><label>幅<input name="width" type="number" required></label><label>偏平率<input name="ratio" type="number" required></label><label>リム径<input name="rim" type="number" required></label><label>ロードインデックス<input name="load"></label><label>速度記号<input name="speed"></label><label>初期フリー在庫<input name="initial" type="number" min="0" value="0" required></label><label>担当者<select name="staff" class="staffSel" required></select></label><label>摘要<input name="note"></label><button class="primary">作成</button></form></section><section id="staff" class="view" hidden><h1>担当者管理</h1><form id="staffForm" class="panel"><label>担当者名<input id="staffName" maxlength="40" required></label><button class="primary">追加</button></form><div id="staffRows"></div></section><section id="detail" class="view" hidden><div id="detailBody"></div></section></section></main><dialog id="opDialog"><form id="opForm"><h2 id="opTitle"></h2><label>本数<input name="quantity" type="number" min="1" value="1" required></label><label>担当者<select name="staff" class="staffSel" required></select></label><label>摘要<input name="note"></label><div><button type="button" id="opCancel">キャンセル</button><button class="primary">登録</button></div></form></dialog><div id="toast"></div><script src="app.js"></script></body></html>
