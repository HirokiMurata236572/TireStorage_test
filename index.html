<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUNLOP タイヤ電子荷票</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script></head><body>
<header><b>DUNLOP タイヤ在庫管理</b><nav><button data-page="list">電子荷票一覧</button><button data-page="new">QRコード新規作成</button><button id="staffBtn">担当者管理</button></nav></header>
<main>
<section id="list" class="page"><div class="title"><div><h1>電子荷票一覧</h1><p>銘柄・サイズ単位の在庫一覧</p></div><button class="primary" data-page="new">＋新規作成</button></div><div class="filters"><input id="search" placeholder="銘柄・サイズ・管理番号で検索"><select id="season"><option value="">季節：すべて</option><option>夏</option><option>冬</option><option>オールシーズン</option></select></div><div id="rows"></div></section>
<section id="new" class="page hidden"><h1>QRコード新規作成</h1><form id="newForm" class="panel grid"><label>銘柄<input id="brand" required placeholder="WINTER MAXX 03"></label><label>季節<select id="newSeason" required><option value="">選択</option><option>夏</option><option>冬</option><option>オールシーズン</option></select></label><label>タイヤ幅<input id="width" required inputmode="numeric" placeholder="195"></label><label>偏平率<input id="ratio" required inputmode="numeric" placeholder="65"></label><label>リム径<input id="rim" required inputmode="numeric" placeholder="15"></label><label>ロードインデックス<input id="load" placeholder="91"></label><label>速度記号<input id="speed" placeholder="Q"></label><label>初期フリー在庫<input id="free" type="number" min="0" value="0" required></label><label>担当者<div class="withbtn"><select id="newStaff" class="staff" required></select><button type="button" class="staffAdd">＋追加</button></div></label><div class="actions"><button type="button" data-page="list">キャンセル</button><button class="primary">作成</button></div></form></section>
<section id="detail" class="page hidden"><div id="detailBody"></div></section>
</main>
<div id="stockModal" class="modal hidden"><div class="dialog"><h2 id="opTitle"></h2><label>本数<input id="opCount" type="number" min="1" value="1"></label><label>担当者<div class="withbtn"><select id="opStaff" class="staff"></select><button type="button" class="staffAdd">＋追加</button></div></label><label>摘要<input id="opNote"></label><div class="actions"><button id="opCancel">キャンセル</button><button id="opSave" class="primary">登録</button></div></div></div>
<div id="staffModal" class="modal hidden"><div class="dialog"><h2>担当者管理</h2><label>担当者名<input id="staffName" maxlength="40" placeholder="例：山田 太郎"></label><div class="actions"><button id="staffClose">閉じる</button><button id="staffSave" class="primary">追加</button></div><ul id="staffList"></ul></div></div>
<div id="toast"></div><script src="app.js"></script></body></html>
